data:
  raw_source: data/raw/train.csv
  raw_working: data/solved/train-cot.csv
  train_prepared: data/prepared/train_stratified.csv
  train_generated: data/generated/train_with_syntetic.csv
  val_prepared: data/prepared/val_stratified.csv
  dataset_name: algorithmic_cot

model:
  id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  sft_output_dir: models/sft_v0.0.12

split:
  val_size: 0.1

train:
  lr: 2e-4
  batch_size: 4
  grad_accum: 8
  epochs: 3
  seed: 31231
  eval_steps: 400
  eval_batches: 8
  logging_steps: 10

  save_steps: 400
  save_total_limit: 6
  resume_from_checkpoint: auto

  max_hours: 10.0

  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  max_seq_len: 8192

  optimizer: paged_adamw_8bit
  warmup_ratio: 0.1
  weight_decay: 0.0
  max_grad_norm: 1e9

  target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj,in_proj,out_proj,embed_tokens,lm_head


evaluate:
  scores_file: data/scores/validation_scores.json
wandb:
  wandb_base_run_name: sft_v0.0.12
